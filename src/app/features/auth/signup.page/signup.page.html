<div class="min-h-screen bg-slate-900 text-white flex items-center justify-center p-4">
    <div class="w-full max-w-md rounded-2xl bg-slate-800 border border-slate-700 p-6">
        <h1 class="text-xl font-semibold mb-1">Sign up</h1>
        <p class="text-sm text-slate-300 mb-6">Create a finance member account</p>

        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
            <div>
                <label class="text-sm text-slate-300">Username</label>
                <input
                    class="mt-1 w-full rounded-xl bg-slate-900 border border-slate-700 px-3 py-2 outline-none focus:border-slate-500"
                    formControlName="username" type="text" autocomplete="username" required />
            </div>

            <div>
                <label class="text-sm text-slate-300">Email</label>
                <input
                    class="mt-1 w-full rounded-xl bg-slate-900 border border-slate-700 px-3 py-2 outline-none focus:border-slate-500"
                    formControlName="email" type="email" autocomplete="email" required />
            </div>

            <div>
                <label class="text-sm text-slate-300">Password</label>
                <input
                    class="mt-1 w-full rounded-xl bg-slate-900 border border-slate-700 px-3 py-2 outline-none focus:border-slate-500"
                    formControlName="password" type="password" autocomplete="new-password" required />
            </div>

            @if (error()) {
            <div class="text-sm text-red-300 bg-red-950/30 border border-red-900 rounded-xl p-3">
                {{ error() }}
            </div>
            }

            <button
                class="w-full rounded-xl bg-sky-600 hover:bg-sky-500 transition px-4 py-2 font-medium disabled:opacity-60"
                [disabled]="loading()" type="submit">
                @if (loading()) { <span>Creating…</span> } @else { <span>Create account</span> }
            </button>

            <button type="button"
                class="w-full rounded-xl bg-slate-700 hover:bg-slate-600 transition px-4 py-2 font-medium"
                (click)="goLogin()">
                Back to login
            </button>
        </form>
    </div>
</div>
