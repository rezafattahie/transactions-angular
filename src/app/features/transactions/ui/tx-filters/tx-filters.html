<div class="flex flex-wrap items-end gap-3">
    <div class="flex flex-col gap-1">
        <label class="text-xs text-slate-400" for="tx-type">Type</label>
        <select id="tx-type"
            class="h-9 rounded-xl border border-slate-700 bg-slate-900/60 px-3 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500/50"
            [value]="type()" (change)="onType(($any($event.target).value))">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
        </select>
    </div>

    <div class="flex flex-col gap-1">
        <label class="text-xs text-slate-400" for="tx-cat">Category</label>
        <select id="tx-cat"
            class="h-9 rounded-xl border border-slate-700 bg-slate-900/60 px-3 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500/50"
            [value]="categoryId() ?? ''" (change)="onCategory(($any($event.target).value))">
            <option value="">All</option>
            @for (c of categories(); track c.objectId) {
            <option [value]="c.objectId">{{ c.name }}</option>
            }
        </select>
    </div>

    <div class="flex flex-col gap-1">
        <label class="text-xs text-slate-400" for="tx-from">From</label>
        <input id="tx-from" type="date"
            class="h-9 rounded-xl border border-slate-700 bg-slate-900/30 px-3 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500/50"
            [value]="from() ?? ''" (input)="onFrom(($any($event.target).value))" />
    </div>

    <div class="flex flex-col gap-1">
        <label class="text-xs text-slate-400" for="tx-to">To</label>
        <input id="tx-to" type="date"
            class="h-9 rounded-xl border border-slate-700 bg-slate-900/30 px-3 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500/50"
            [value]="to() ?? ''" (input)="onTo(($any($event.target).value))" />
    </div>

    <button type="button"
        class="h-9 rounded-xl border border-slate-700 px-3 text-sm text-slate-200 hover:border-slate-500 hover:bg-slate-900/40 transition"
        (click)="clear()">
        Clear
    </button>
</div>
