<table data-testid="tx-table" class="min-w-full text-sm">
    <thead class="bg-slate-900/40 text-slate-300">
        <tr>
            <th class="text-left px-4 py-3 font-medium">Date</th>
            <th class="text-left px-4 py-3 font-medium">Category</th>
            <th class="text-left px-4 py-3 font-medium hidden md:block">Description</th>
            <th class="text-right px-4 py-3 font-medium">Amount</th>
            <th class="px-4 py-3"></th>
        </tr>
    </thead>

    <tbody>
        @for (t of transactions(); track t.objectId) {
        <tr class="border-t border-slate-700 hover:bg-slate-700/30 transition">
            <td class="px-4 py-3 text-slate-300 whitespace-nowrap">
                <span class="hidden md:block"> {{ t.entryDate | date:'EEEE, dd. MMMM yyyy':'':'de-DE' }}</span>
                <span class="md:hidden"> {{ t.entryDate | date:'EE dd. MMM':'':'de-DE' }}</span>

            </td>
            <td class="px-4 py-3">{{ categoryName(t.category) }}</td>
            <td class="px-4 py-3 text-slate-300 hidden md:block">{{ t.description || '—' }}</td>
            <td class="px-4 py-3 text-right font-semibold tabular-nums">
                {{ t.amount | number:'1.2-2':'de-DE' }} €
            </td>
            <td class="px-4 py-3 text-right">
                <button type="button" (click)="edit.emit(t)" class="text-xs text-sky-400 hover:text-sky-300 mr-2">
                    Edit
                </button>
                <button type="button" (click)="remove.emit(t)" class="text-xs text-red-400 hover:text-red-300">
                    Remove
                </button>
            </td>
        </tr>
        }
    </tbody>
</table>
