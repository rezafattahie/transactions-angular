<table data-testid="tx-table" class="min-w-full text-sm">
    <thead class="bg-slate-900/40 text-slate-300">
        <tr>
            <th class="text-left px-4 py-3 font-medium">Date</th>
            <th class="text-left px-4 py-3 font-medium">Category</th>
            <th class="text-left px-4 py-3 font-medium hidden md:block">Description</th>
            <th class="text-right px-4 py-3 font-medium">Amount</th>
            <th class="px-4 py-3"></th>
        </tr>
    </thead>

    <tbody>
        @for (t of transactions(); track t.objectId) {
        <tr class="border-t border-slate-700 hover:bg-slate-700/30 transition">
            <td class="md:px-4 py-2 text-slate-300 whitespace-nowrap">
                <span class="hidden md:block"> {{ t.entryDate | date:'EEEE, dd. MMMM yyyy':'':'de-DE' }}</span>
                <span class="md:hidden"> {{ t.entryDate | date:'EE dd. MMM':'':'de-DE' }}</span>

            </td>
            <td class="md:px-4 py-2">{{ categoryName(t.category) }}</td>
            <td class="md:px-4 py-2 text-slate-300 hidden md:block">{{ t.description || '—' }}</td>
            <td class="md:px-4 py-2 text-right font-semibold tabular-nums">
                {{ t.amount | number:'1.2-2':'de-DE' }} €
            </td>
            <td class="py-3 text-right">
                <button type="button" (click)="edit.emit(t)"
                    class="inline-grid h-8 w-8 place-items-center rounded-xl hover:bg-slate-700/40 transition"
                    title="Edit" aria-label="Edit">
                    <svg viewBox="0 0 24 24" class="h-4 w-4 text-sky-300" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
                    </svg>
                </button>

                <button type="button" (click)="remove.emit(t)"
                    class="inline-grid h-8 w-8 place-items-center rounded-xl hover:bg-slate-700/40 transition"
                    title="Remove" aria-label="Remove">
                    <svg viewBox="0 0 24 24" class="h-4 w-4 text-red-300" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M3 6h18" />
                        <path d="M8 6V4h8v2" />
                        <path d="M19 6l-1 14H6L5 6" />
                        <path d="M10 11v6" />
                        <path d="M14 11v6" />
                    </svg>
                </button>
            </td>

        </tr>
        }
    </tbody>
</table>
