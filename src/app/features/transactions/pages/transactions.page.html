<div class="min-h-screen bg-slate-900 text-white">
    <app-header title="Transactions"></app-header>

    <main class="p-4 max-w-6xl mx-auto">
        <div class="flex items-end justify-between gap-3 mb-4">

            <app-tx-filters [value]="store.filters()" (changed)="store.setFilters($event)"
                [categories]="store.categories()" />

            <div class="flex items-center gap-2">
                <!-- Refresh Icon -->
                <button type="button"
                    class="h-9 w-9 rounded-xl border border-slate-700 hover:border-slate-500 hover:bg-slate-900/40 transition grid place-items-center"
                    (click)="store.loadInitial()" title="Refresh" aria-label="Refresh">
                    <svg viewBox="0 0 24 24" class="h-5 w-5 text-slate-200" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M21 12a9 9 0 1 1-3-6.7" />
                        <path d="M21 3v7h-7" />
                    </svg>
                </button>

                <!-- Add Icon -->
                <button type="button"
                    class="h-9 w-9 rounded-xl bg-sky-500 hover:bg-sky-400 transition grid place-items-center"
                    (click)="openAdd()" title="Add" aria-label="Add">
                    <svg viewBox="0 0 24 24" class="h-5 w-5 text-slate-950" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M12 5v14" />
                        <path d="M5 12h14" />
                    </svg>
                </button>
            </div>
        </div>


        @if (store.error()) {
        <div class="mb-4 text-sm text-red-300 bg-red-950/30 border border-red-900 rounded-xl p-3">
            {{ store.error() }}
        </div>
        }
        <app-tx-table [transactions]="store.transactions()" [categoryMap]="store.categoryMap()"
            [loading]="store.loading()" (edit)="openEdit($event)"
            (remove)="store.removeTransaction($event.objectId).subscribe()"></app-tx-table>

        <div class="mt-3 flex items-center justify-center">
            @if (store.hasMore()) {
            <button type="button" (click)="loadMore()"
                class="text-xs text-sky-400 hover:text-sky-300 transition disabled:opacity-60"
                [disabled]="!store.canLoadMore()">
                @if (store.loadingMore()) { <span>Loading…</span> } @else { <span>Load more</span> }
            </button>
            }
        </div>
    </main>
</div>

<app-tx-form-modal [open]="showForm()" [editing]="editing()" (closed)="closeForm()"
    (saved)="closeForm()"></app-tx-form-modal>
