<header class="flex items-center justify-between px-4 py-3 bg-slate-700 text-white border-b border-slate-700">
    <div class="flex items-center gap-3">
        <button title="Back to Portfolio" type="button"
            class="px-3 py-2 rounded-xl hover:bg-slate-800/70 transition text-sm">
            <a href="/portfolio-site/index.html"><svg viewBox="0 0 24 24" class="h-5 w-5 text-slate-200" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg></a>
        </button>
        <div class="p-2 rounded-xl bg-amber-500 text-slate-700 flex items-center justify-center font-bold">
            {{currentMember().username.toLocaleUpperCase()}}
        </div>
        <div class="flex flex-col leading-tight">
            <span class="text-base text-amber-400 font-semibold">Angular Transactions</span>
            <span class="text-sm text-slate-400">{{ title() }}</span>
        </div>
    </div>

    <div class="flex items-center gap-2">
        @if (showLogout()) {
        <button type="button" (click)="logout()"
            class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-800/70 transition text-sm">
            Logout
        </button>
        }
    </div>
</header>
